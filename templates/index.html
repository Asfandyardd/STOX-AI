<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stox!Live - Stock Market Live, Quote, Business & Finance News</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-yf sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="bi bi-graph-up-arrow me-2" style="color: var(--yf-purple);"></i> STOX! <span>LIVE AI</span>
            </a>
            
            <div class="mx-auto col-md-6 col-lg-5">
                <form id="search-form" class="input-group search-box">
                    <input type="text" id="search-input" class="form-control" placeholder="Search symbol (e.g. AAPL, TSLA, BTCUSD)..." autocomplete="off">
                    <button class="btn" type="submit"><i class="bi bi-search"></i></button>
                </form>
            </div>

            <div class="d-none d-lg-block text-muted small">
                <i class="bi bi-shield-check text-success"></i> TradingView Engine Live
            </div>
        </div>
    </nav>

    <!-- Asset Quick Ticker Bar -->
    <div class="ticker-bar">
        <div class="container-fluid">
            <span class="asset-chip" data-symbol="AAPL">AAPL</span>
            <span class="asset-chip" data-symbol="TSLA">TSLA</span>
            <span class="asset-chip" data-symbol="NVDA">NVDA</span>
            <span class="asset-chip" data-symbol="BTCUSD">BTCUSD</span>
            <span class="asset-chip" data-symbol="ETHUSD">ETHUSD</span>
            <span class="asset-chip" data-symbol="SOLUSD">SOLUSD</span>
            <span class="asset-chip" data-symbol="MSFT">MSFT</span>
            <span class="asset-chip" data-symbol="AMZN">AMZN</span>
            <span class="asset-chip" data-symbol="GOOGL">GOOGL</span>
            <span class="asset-chip" data-symbol="META">META</span>
        </div>
    </div>

    <!-- Main Dashboard Body -->
    <div class="container-fluid py-4">
        
        <!-- TradingView Symbol Info Live Header Widget (Fixed height to prevent squishing) -->
        <div class="yf-card mb-4 p-2" style="height: 115px; overflow: hidden;">
            <div id="tradingview-symbol-info-container"></div>
        </div>

        <!-- Charts & AI Analyzer Grid -->
        <div class="row">
            <!-- Left Column: TradingView Interactive Chart -->
            <div class="col-lg-8 mb-4 mb-lg-0">
                <div class="yf-card h-100 mb-0">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0 text-white"><i class="bi bi-graph-up me-2 text-purple" style="color: var(--yf-purple);"></i>Interactive Live Chart</h5>
                        <span class="badge bg-dark border border-secondary">TradingView Feed</span>
                    </div>
                    <div id="tradingview-widget-container" style="height: 500px;"></div>
                </div>
            </div>

            <!-- Right Column: Groq AI Stock Analyzer -->
            <div class="col-lg-4">
                <div class="yf-card h-100 mb-0 d-flex flex-column">
                    <div class="ai-header d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0 text-white"><i class="bi bi-cpu me-2 text-info"></i>Groq AI Stock Analyzer</h5>
                        <span class="badge bg-info text-dark">Llama 3.3</span>
                    </div>
                    
                    <div id="ai-analysis-content" class="flex-grow-1">
                        <div class="text-center py-5">
                            <div class="spinner-border text-info" role="status"></div>
                            <p class="mt-2 text-muted small">Analyzing TradingView live feed...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- TradingView External Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <!-- Custom Frontend Logic -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
